<span class="star-rating" title="{{ rating }} out of {{ max_stars }}" aria-label="{{ rating }} stars">

    {% for _ in full %}
    <svg class="star star-full" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
    </svg>
    {% endfor %}

    {% if half %}
    <svg class="star star-half" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="halfGrad">
                <stop offset="50%" stop-color="currentColor"/>
                <stop offset="50%" stop-color="transparent"/>
            </linearGradient>
        </defs>
        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
                 fill="url(#halfGrad)" stroke="currentColor"/>
    </svg>
    {% endif %}

    {% for _ in empty %}
    <svg class="star star-empty" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
    </svg>
    {% endfor %}

    <span class="star-value">{{ rating }}</span>

</span>
